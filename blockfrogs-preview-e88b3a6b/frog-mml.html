    cv.addEventListener('wheel', (/** @type {WheelEvent} */ e) => { e.preventDefault(); zoom = Math.min(2.5, Math.max(0.3, zoom * (1 + Math.sign(e.deltaY) * 0.1))); dist = fit() * zoom; }, { passive: false });
    window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); dist = fit() * zoom; });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta(); idle += dt;
      if (!drag && idle > 2 && __bfPreview.spin()) theta += dt * 0.35; /*PREVIEW HOOK*/
      mixers.forEach((/** @type {any} */ m) => m.update(__bfPreview.dt(dt))); /*PREVIEW HOOK*/ place(); renderer.render(scene, camera);
    });
    if (overlay) overlay.style.display = 'none';
    { // badge always exists; embed mode hides it with CSS. Text follows the live mint verdict (updateBadge).
      const badge = document.createElement('div'); badge.id = 'bf-b';
      BADGE.h = blockHeight; BADGE.extra = (missing.length ? ` · ${missing.length} PART(S) NOT INSCRIBED` : '') + (failed ? ` · ${failed} FAILED` : '');
      document.body.appendChild(badge); updateBadge();
      if (!EMBED) document.title = `BlockFrogs · ${blockHeight}.bitmap`;
    }
    window.__bf = { blockHeight, traits: (await ctxP).traits.map((/** @type {any} */ t) => t.part + (t.color ? `_${t.color}` : '')), loaded: frog.children.length, missing, failed, validity: VALIDITY, mint: MINT, embed: EMBED };
    toParent({ type: 'blockfrog:ready', inscriptionId: getOwnId() });
  };

  /* ======================= GLB EXPORT (v3) ======================= */
  /**
   * Static copy of the frog in its current pose: skinning, node transforms and the size-tier scale/y are baked into
   * plain float vertices (no skins, no animation), so it drops into any glTF engine at world scale.
   */
  const bakeStatic = (/** @type {any} */ THREE, /** @type {any} */ frog) => {
    frog.updateMatrixWorld(true);
    const out = new THREE.Group(); out.name = 'blockfrog';
    const W = new THREE.Matrix4(), S = new THREE.Matrix4(), N = new THREE.Matrix3(), v = new THREE.Vector3();
    frog.traverse((/** @type {any} */ o) => {
      if (!o.isMesh) return;
      for (let p = o; p; p = p.parent) if (!p.visible) return;
      const g = o.geometry.clone(); const P = g.attributes.position, Nm = g.attributes.normal, J = g.attributes.skinIndex, Wt = g.attributes.skinWeight;
      const skin = o.isSkinnedMesh && J && Wt;
      const bones = skin ? o.skeleton.bones.map((/** @type {any} */ b, /** @type {number} */ i) => new THREE.Matrix4().multiplyMatrices(b.matrixWorld, o.skeleton.boneInverses[i])) : [];
      const pos = new Float32Array(P.count * 3), nor = Nm ? new Float32Array(Nm.count * 3) : null;
      for (let i = 0; i < P.count; i++) {
        W.copy(o.matrixWorld);
        if (skin) { // same maths as three's skinning shader: matrixWorld * bindMatrixInverse * sum(w * bone * boneInverse) * bindMatrix
          S.elements.fill(0); let sum = 0;
          for (let k = 0; k < 4; k++) {
            const w = Wt.getComponent(i, k), b = bones[J.getComponent(i, k)]; if (!w || !b) continue;
            sum += w; for (let q = 0; q < 16; q++) S.elements[q] += w * b.elements[q];
          }
          if (sum > 1e-6) W.multiply(o.bindMatrixInverse).multiply(S).multiply(o.bindMatrix);
        }
        v.fromBufferAttribute(P, i).applyMatrix4(W).toArray(pos, i * 3);
        if (nor) { N.getNormalMatrix(W); v.fromBufferAttribute(Nm, i).applyMatrix3(N).normalize().toArray(nor, i * 3); }
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      if (nor) g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      ['skinIndex', 'skinWeight', 'tangent'].forEach((a) => g.deleteAttribute(a)); g.morphAttributes = {};
      const m = new THREE.Mesh(g, o.material); m.name = o.name; out.add(m);
    });
    return out;
  };

  /** @type {Record<string, Promise<ArrayBuffer>>} */ const glbCache = {};
  /**
   * One binary GLB (ArrayBuffer, a fresh copy per call) of the whole frog.
   * Default: static, everything baked. { rig: true }: skeletons + animations kept, size-tier scale/y on the root node.
   */
  const getGLB = (/** @type {any} */ opts = {}) => {
    const key = opts && opts.rig ? 'rig' : 'static';
    if (!glbCache[key]) {
      glbCache[key] = (async () => {
        const { net } = await ctxP; const F = await getFrog();
        const X = net.exporter ? await import(content(net.exporter)) : F.lib;
        if (!X.GLTFExporter) throw new Error('GLB export unavailable: no GLTFExporter inscription configured for this network');
        F.mixers.forEach((/** @type {any} */ m) => m.setTime(0)); F.frog.updateMatrixWorld(true); // deterministic pose: frame 0
        // Animated quaternions can drift a hair past 1.0, which glTF validators reject: clamp before writing.
        if (key === 'rig') F.frog.traverse((/** @type {any} */ o) => { const q = o.quaternion; q.set(...q.toArray().map((/** @type {number} */ c) => Math.max(-1, Math.min(1, c)))); });
        const input = key === 'rig' ? F.frog : bakeStatic(F.lib.THREE, F.frog);
        // GLTFExporter r178 writes skin.skeleton = first joint, which is not always the joints' common root (invalid glTF).
        // "skeleton" is optional, so drop it.
        const ex = new X.GLTFExporter().register((/** @type {any} */ w) => ({ afterParse: () => (w.json.skins || []).forEach((/** @type {any} */ k) => { delete k.skeleton; }) }));
        return ex.parseAsync(input, { binary: true, animations: key === 'rig' ? F.clips : [] });
      })();
      glbCache[key].catch(() => { delete glbCache[key]; });
    }
    return glbCache[key].then((b) => b.slice(0));
  };

  /** ?format=glb: build the GLB, offer it as a download (blob URL) and hand it to the parent window if embedded. */
  const glbPage = async () => {
    const { blockHeight, ownId } = await ctxP;
    say('BUILDING GLB', `${blockHeight}.bitmap`);
    const buf = await getGLB({ rig: qs.get('rig') === '1' }); const bytes = buf.byteLength;
    const name = `blockfrog-${blockHeight}.glb`;
    const url = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
    window.blockfrog.glbURL = url;
    window.__bf = { blockHeight, glbBytes: bytes, embed: EMBED };
    toParent({ type: 'blockfrog:glb', inscriptionId: ownId, byteLength: bytes, glb: buf }, [buf]);
    if (EMBED) return;
    const o = ui(); o.className = ''; o.style.display = 'flex'; o.innerHTML = '';
    const a = document.createElement('a'); a.href = url; a.download = name; a.textContent = `DOWNLOAD ${name}`;
    const s = document.createElement('small'); s.textContent = `${bytes} bytes · binary glTF`;
    o.append(a, document.createElement('br'), s);
    document.title = `BlockFrogs · ${name}`;
    try { a.click(); } catch (e) { /* download blocked (sandbox): the link stays */ }
  };

  /* ======================= EMBED API: window.blockfrog + postMessage (v3) ======================= */
  window.blockfrog = {
    standard: STANDARD, version: VERSION, embed: EMBED, metadata: null, glbURL: null,
    /** Promise<object>: same object as .metadata, once the chain has been read. */
    getMetadata: () => ctxP.then((c) => c.meta),
    /** Promise<ArrayBuffer>: binary GLB. getGLB({ rig: true }) keeps skeletons + animations. */
    getGLB,
    /** Promise<{valid,code,reason,...}>: the on-chain mint-rule verdict (valid null = could not be verified). */
    getValidity: () => verdictP,
  };
  window.addEventListener('message', (e) => {
    const d = e.data; if (!d || typeof d.type !== 'string' || d.type.indexOf('blockfrog:') !== 0) return;
    const src = /** @type {any} */ (e.source) || window.parent;
    const reply = (/** @type {any} */ msg, /** @type {any[]} */ tr = []) => { try { src.postMessage({ ...msg, requestId: d.requestId }, '*', tr); } catch (x) { /* ignore */ } };
    const err = (/** @type {string} */ type) => (/** @type {any} */ x) => reply({ type, error: String((x && x.message) || x) });
    if (d.type === 'blockfrog:getGLB') getGLB(d.options || {}).then((glb) => reply({ type: 'blockfrog:glb', inscriptionId: getOwnId(), byteLength: glb.byteLength, glb }, [glb]), err('blockfrog:glb'));
    else if (d.type === 'blockfrog:embed') { setEmbed(d.transparent !== false); reply({ type: 'blockfrog:embed', transparent: EMBED }); }
    else if (d.type === 'blockfrog:getValidity') verdictP.then((v) => reply({ type: 'blockfrog:validity', validity: v }));
    else if (d.type === 'blockfrog:getMetadata' || (d.type === 'blockfrog:metadata' && !d.metadata)) ctxP.then((c) => reply({ type: 'blockfrog:metadata', metadata: c.meta }), err('blockfrog:metadata'));
  });

  /* ======================= BOOT ======================= */
  /** For indexers and marketplaces: {height, traits, valid, reason} (+ code, firstId, inscriptionId, parentId, masterId,
   *  checks, version, rules). valid: true = official, false = invalid/duplicate, null = pending or not verifiable.
   *  BLOCKFROG.ready (non-enumerable) resolves with the final verdict; a 'blockfrog:validated' event fires too. */
  window.BLOCKFROG = { height: null, traits: null, valid: null, reason: MINT.reason, code: MINT.code, firstId: null,
    inscriptionId: getOwnId(), parentId: null, masterId: null, checks: {}, version: VERSION, rules: MINT_RULES };
  Object.defineProperty(window.BLOCKFROG, 'ready', { value: verdictP, enumerable: false });
  setEmbed(EMBED);
  (async () => {
    const mml = isMMLHost();
    const view = !mml && FORMAT !== 'json';
    if (view) say('LOADING FROG', 'reading the chain…');
    const watchdog = view ? setTimeout(() => { if (!window.__bf) say('STILL LOADING…', 'the chain is slow or a recursive endpoint is unavailable', true); }, 20000) : 0;
    try {
      const ownId = getOwnId();
      const [netName, meta1] = await Promise.all([detectNetwork(), getOwnMeta(ownId)]);
      const net = NETWORKS[netName], meta0 = meta1 || {};
      const r = await resolveHeight(ownId, meta0);
      const blockHeight = r.h; STATE.metaH = meta0.h != null ? Number(meta0.h) : null;
      const traits = __bfPreview.traits(deriveTraits(blockHeight), blockHeight); /*PREVIEW HOOK*/
      applyMML(net, blockHeight, traits); __bfPreview.applied(blockHeight, traits); /*PREVIEW HOOK*/
      Object.assign(window.BLOCKFROG, { height: Number(blockHeight), traits, parentId: STATE.parentId });
      const meta = buildMeta(net, netName, ownId, blockHeight, traits);
      window.blockfrog.metadata = meta;
      ctxOk({ net, netName, ownId, blockHeight, traits, meta });
      toParent({ type: 'blockfrog:metadata', metadata: meta });
      // Mint-rule validation runs in the BACKGROUND: the renderer never waits for it (instant display), and it cannot throw.
      if (r.mode) applyVerdict({ valid: null, code: r.mode, reason: r.mode === 'MASTER' ? 'master inscription (demo frog)' : 'preview override ?h=', checks: {} }, mml);
      else validateMint(IO, {
        ownId, rules: MINT_RULES, hrp: HRP[netName] || 'bc',
        firstIsFirst: async (/** @type {number} */ n) => (net.oci && n <= net.ociMaxHeight ? (await import(content(net.oci))).getBitmapInscriptionId(n) : null),
      }).then((v) => applyVerdict(v, mml), (e) => applyVerdict({ valid: null, code: 'UNVERIFIED', reason: REASONS.UNVERIFIED, error: String(e), checks: {} }, mml));
      if (mml) return;
      if (FORMAT === 'json') { await Promise.race([verdictP, new Promise((ok) => setTimeout(ok, 15000))]); showJSON(meta); } // machine readers get the verdict in the JSON
      else if (FORMAT === 'glb') await glbPage();
      else await renderThree();
    } catch (e) {
      ctxFail(e);
      if (mml) console.error(e); else fail(e);
    } finally { if (watchdog) clearTimeout(watchdog); }
  })();
  window.addEventListener('error', (e) => { if (!isMMLHost() && !window.__bf && FORMAT !== 'json') fail(e.error || e.message); });
</script>
