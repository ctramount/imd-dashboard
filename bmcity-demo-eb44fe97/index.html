mkt:function(){var rows=marketRows();var f=S.mkf||"all";var sort=S.mks||"new";var names=[];rows.forEach(function(r){if(names.indexOf(r.coll)<0)names.push(r.coll)});var view=rows.map(function(r,i){return{r:r,i:i}}).filter(function(x){return f==="all"||x.r.coll===f});if(sort==="lo")view.sort(function(a,b){return a.r.price-b.r.price});if(sort==="hi")view.sort(function(a,b){return b.r.price-a.r.price});view.sort(function(a,b){return (a.r.status==="sold")-(b.r.status==="sold")});var chips=['<button type="button" aria-pressed="'+(f==="all")+'" onclick="S.mkf=\'all\';show(\'mkt\')">All</button>'].concat(names.map(function(n){return '<button type="button" aria-pressed="'+(f===n)+'" onclick="S.mkf=\''+esc(n)+'\';show(\'mkt\')">'+esc(n)+'</button>'})).join("");var tiles=view.map(function(x){var r=x.r;return '<button type="button" class="mtile" onclick="go(\'listing\','+x.i+')">'+artImg(r.height,r.m,"")+'<div class="t"><b>'+esc(r.coll)+'</b><span>'+r.height+'.bitmap</span><div class="p">'+fmt(r.price)+' sats'+(r.status==="sold"?' <em class="sold">Sold</em>':'')+'</div></div></button>'}).join("");$('<h1>Market</h1><p class="s">Buy and sell pieces from Bitmap City collections. Sample listings, nothing is broadcast.</p><div class="toolbar"><div class="filt" role="group" aria-label="Collection">'+chips+'</div><label class="vh" for="mks">Sort</label><select id="mks" onchange="S.mks=this.value;show(\'mkt\')"><option value="new"'+(sort==="new"?" selected":"")+'>Newest</option><option value="lo"'+(sort==="lo"?" selected":"")+'>Price: low to high</option><option value="hi"'+(sort==="hi"?" selected":"")+'>Price: high to low</option></select></div><div class="mkgrid">'+tiles+'</div><details><summary>Fees</summary><p>The buyer pays the listed price and no fee. The seller pays the creator royalty (0 to 2.5%, default 1%), paid straight to the creator in the sale. There is no seller fee at launch. A royalty under 330 sats is rounded up to 330.</p><p class="fine">Fees are enforced by this marketplace, not by Bitcoin. Another market may skip them.</p></details>')},

how:function(){var tab=S.how||"collectors";var supplyOpen=currentView.a==="supply"?" open":"";$('<h1>How it works</h1><p><span class="mocktag">Testnet demo</span></p><p class="s">Nothing here is real Bitcoin. Collectors, sellers, and creators each get a short version.</p><div class="filt" role="group" aria-label="Guide for"><button type="button" aria-pressed="'+(tab==="collectors")+'" onclick="S.how=\'collectors\';rerender(\'how\')">Collectors</button><button type="button" aria-pressed="'+(tab==="sellers")+'" onclick="S.how=\'sellers\';rerender(\'how\')">Sellers</button><button type="button" aria-pressed="'+(tab==="creators")+'" onclick="S.how=\'creators\';rerender(\'how\')">Creators</button></div><div class="timeline"><div class="tstep"><b>Launch</b>Parent goes to the project wallet.</div><div class="tstep"><b>Mint open</b>1,008 blocks, about 7 days.</div><div class="tstep"><b>Closed</b>Mint ends. Parent burn is pending.</div><div class="tstep"><b>Supply locked</b>Parent burned.</div></div>'+(tab==="collectors"?'<details open><summary>For collectors</summary><ol><li><b>Limits:</b> One transaction at a time: after you mint, wait for that transaction to confirm before your next mint. Up to 25 Bitmaps in one transaction. The 1,000-sat service fee applies to each mint, not each transaction.</li><li>You need a Bitmap. Each creator sets how many official mints a Bitmap gets (default 1) and can limit which Bitmaps qualify to a range of blocks, for example 840,000 to 850,000. The creator can also cap the total supply. The first valid mints win.</li><li>Only the real Bitmap for a block counts. Anyone can inscribe the same block number again, but the first valid one (by block, then inscription number, as the major Bitmap indexers count it) is the only legitimate Bitmap. Later copies cannot mint here.</li><li>Your Bitmap comes back whole. The art goes on a fresh sat. It stays tied to that Bitmap by a parent tag and the block height. Generative traits come from that block.</li><li>You pay the mint price plus the network fee. The creator pays a 5% platform fee out of the price. Only when that 5% is under 1,000 sats do you pay the difference as a service fee. Checkout shows every line before you sign.</li><li>The mint is open for 1,008 blocks (~7 days), then it closes.</li></ol></details><details><summary>Network fee</summary><p>'+esc(MINT_SIZE_LINE)+'</p></details><details><summary>Wallet safety</summary><ul><li>Only our own buttons ask your wallet to sign.</li><li>Art can\'t: it runs walled off from this page and from your wallet, and art that stops responding is stopped.</li><li>Any signing prompt or seed-phrase request that appears inside art is fake. Close it.</li></ul></details><details><summary>Who decides which mints are official</summary><ul><li>'+esc(VERDICT_SOURCE)+'</li><li>LiveOCI is shown beside it as a second opinion. It never changes the verdict.</li><li>Mints that break a rule stay on-chain but are not official.</li></ul><p>'+esc(OCI_GAP_FINE)+'</p></details><div class="lock" role="note"><b>Supply locks when the mint closes</b><p>After the end block (about 7 days after launch), the collection\'s parent is burned on-chain, so no more can ever be minted — not even by the creator. Everything minted before close is the entire collection forever.</p></div><details id="supply-lock"'+supplyOpen+'><summary>Supply lock</summary><p>While the mint is open: Supply locks when this mint closes. After close: Mint closed. Supply is locking: the parent burn is pending. After the burn: Supply locked forever, with the burn transaction as proof.</p><p>After close, the team burns the parent. Open the burn transaction on the collection and check that the parent sat moved to an output nobody can spend. That is how you check the burn yourself.</p><p>An edition is the same file every time. A generative mint needs a script, so each Bitmap looks different.</p></details>':"")+(tab==="sellers"?'<details open><summary>For sellers</summary><ol><li>You can sell the mint, or sell the piece later.</li><li>The buyer pays the listed price and no fee. There is no seller fee at launch. The seller pays the creator royalty, 0 to 2.5% (default 1%), paid straight to the creator in the sale.</li><li>On a 100,000 sat sale at the 1% default royalty, the creator gets 1,000 sats and the seller keeps 99,000.</li><li>A royalty under 330 sats is rounded up to 330, so the creator is always paid.</li><li>These fees are enforced by this marketplace, not by Bitcoin. Another market may skip them.</li><li>You can cancel a listing before it sells.</li></ol></details>':"")+(tab==="creators"?'<details open><summary>For creators</summary><ol><li>Choose a parent: a Bitmap, another inscription, or a vibe or upload.</li><li>The parent is sent to the project wallet and burned after close to lock supply. You will not get it back. '+SUPPLY_LOCK+'</li><li>'+EDITION_COPY+' '+GENERATIVE_COPY+' '+DELEGATE_LINE+'</li><li>Hard limit about 390KB, with a warning over 100KB. PNG, WebP, GIF, GLB, or HTML. '+WORLDS_TIP+'</li><li>You receive your mint price minus a 5% platform fee. Royalty on resales is 0 to 2.5%, default 1%.</li><li>Timeline: launch, open about 7 days, closed and awaiting burn, then burned and supply locked.</li></ol></details>':"")+'<h2>Glossary</h2><details><summary>Bitmap</summary><p>A block height you hold, written as the height followed by .bitmap.</p></details><details><summary>Inscription</summary><p>A file stored in a Bitcoin transaction.</p></details><details><summary>Parent and child</summary><p>The parent defines the collection. A child is one mint.</p></details><details><summary>Delegate</summary><p>A tiny pointer to a file that was inscribed once.</p></details><details><summary>Burn</summary><p>'+SUPPLY_LOCK+'</p></details><details><summary>Sats</summary><p>The small unit of Bitcoin. One bitcoin is 100,000,000 sats.</p></details>')}};
