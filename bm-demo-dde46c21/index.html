<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bitmap Mints — demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0e0c;color:#f2eee5;font:16px/1.4 system-ui,sans-serif}
.ban{background:#e0a15a;color:#1a1408;text-align:center;font-weight:700;font-size:13px;padding:7px}
header{display:flex;gap:8px;padding:12px 16px;position:sticky;top:0;background:#0d0e0cee;z-index:2}
header b{flex:1;font-size:18px;align-self:center}.tab{background:#1c1d19;border:1px solid #333;color:#ccc;border-radius:999px;padding:10px 14px;font-size:14px}.tab.on{background:#f2eee5;color:#111}
main{max-width:480px;margin:0 auto;padding:8px 16px 60px}h1{font-size:26px;margin:10px 0 6px}h2{font-size:20px;margin:6px 0}p.s{color:#a9a294;margin:4px 0 14px}
.card{background:#171813;border:1px solid #2e2b24;border-radius:18px;overflow:hidden;margin-bottom:16px}.card .m{padding:14px 16px}
svg{display:block;width:100%;height:auto}.row{display:flex;justify-content:space-between;color:#c9c1b2;font-size:15px;margin:3px 0}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:#f7931a;color:#111;font-size:18px;font-weight:700;margin-top:12px;cursor:pointer}.btn.g{background:#26271f;color:#eee;border:1px solid #3a3a30}.btn:disabled{opacity:.4}
input,textarea{width:100%;background:#1c1d19;border:1px solid #3a3a30;color:#fff;border-radius:12px;padding:14px;font-size:16px;margin:6px 0}
.pick{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #3a3a30;border-radius:12px;margin:8px 0;cursor:pointer}.pick.on{border-color:#f7931a;background:#2a1f10}
.warn{background:#3a1512;border:1px solid #a33;color:#ffb4a8;border-radius:12px;padding:12px;font-size:15px}
.steps{color:#a9a294;font-size:13px;letter-spacing:.05em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid .m{padding:8px 10px;font-size:13px}
.ok{font-size:40px;font-weight:800}.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.chk input{width:26px;height:26px;margin:0}
.seg{display:flex;gap:8px}.seg button{flex:1}.small{font-size:13px;color:#8d877b}
</style></head><body>
<div class="ban">Test network demo — nothing real</div>
<header><b>Bitmap Mints</b><button class="tab on" id="tb" onclick="go('list')">Mint</button><button class="tab" id="tc" onclick="go('c1')">Create</button></header>
<main id="app"></main>
<script>
// Traits: same function as the prototype renderer (src/traits.ts); paint adapted from src/renderer.ts
function traits(height, block){var digits=String(height).split("");var sum=0;for(var i=0;i<digits.length;i++)sum+=Number(digits[i]);var text=String(height);var reversed=text.split("").reverse().join("");var hash=String(block.hash||"").toLowerCase();if(!/^[0-9a-f]{64}$/.test(hash))hash="0".repeat(64);function byteAt(i){return parseInt(hash.substr(i*2,2),16)}var tx=Number(block.transaction_count)||0;var ts=Number(block.timestamp)||0;var year=new Date(ts*1000).getUTCFullYear();var motifs=["grid","rings","strata","glyph","pulse"];var inks=["chalk","amber","tide","ember","moss"];var density=tx<2?"quiet":tx<50?"settled":tx<500?"busy":"roaring";return{district:text+".bitmap",height:height,digitSum:sum,palindrome:text===reversed,contains420:text.indexOf("420")!==-1,leadingDigit:Number(digits[0]),era:year,density:density,motif:motifs[byteAt(0)%5],ink:inks[byteAt(1)%5],hue:byteAt(2),accent:byteAt(3),cells:(byteAt(4)%5)+3,txCount:tx,hashPrefix:hash.slice(0,8),bits:block.bits,nonce:block.nonce}}
function seeded(h){var s=h*2654435761>>>0,o="";for(var i=0;i<64;i++){s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;o+=(s&15).toString(16)}return{hash:o,timestamp:1231006505+h*600,transaction_count:(h*7919)%3000,bits:0x17034219,nonce:s,src:"seeded"}}
var cache={},TIP=null;
async function block(h){if(cache[h])return cache[h];try{var r=await fetch("https://mempool.space/api/block-height/"+h);if(!r.ok)throw 0;var hs=await r.text();var b=await (await fetch("https://mempool.space/api/block/"+hs)).json();cache[h]={hash:b.id,timestamp:b.timestamp,transaction_count:b.tx_count,bits:b.bits,nonce:b.nonce,src:"mempool.space"}}catch(e){cache[h]=seeded(h)}return cache[h]}
// style: 0 grid(prototype), 1 rings, 2 strata — prompt picks style + palette shift
function paint(t,st,shift){st=st||0;shift=shift||0;var hue=(Math.round(t.hue*360/255)+shift)%360,ac=(Math.round(t.accent*360/255)+shift)%360,c=t.cells,r="";
if(st==0){for(var y=0;y<c;y++)for(var x=0;x<c;x++){if(((x*13+y*7+t.accent+t.leadingDigit)%(t.motif==="rings"?3:2))!==0)continue;r+='<rect x="'+(16+x*28)+'" y="'+(16+y*28)+'" width="22" height="22" rx="4" fill="hsl('+ac+' 55% 58%)" opacity=".9"/>'}}
else if(st==1){for(var i=c+3;i>0;i--)r+='<circle cx="'+(160+(t.nonce%40)-20)+'" cy="100" r="'+(i*14)+'" fill="none" stroke="hsl('+((ac+i*25)%360)+' 60% 60%)" stroke-width="'+(2+(t.digitSum+i)%6)+'"/>'}
else{for(var j=0;j<10;j++){var hh=8+((t.hue*(j+3)+t.txCount)%22);r+='<rect x="0" y="'+(j*19)+'" width="'+(120+((t.accent*(j+1)+t.nonce)%200))+'" height="'+hh+'" fill="hsl('+((ac+j*12)%360)+' 50% '+(40+j*3)+'%)"/>'}}
return '<svg viewBox="0 0 320 220"><rect width="320" height="220" fill="hsl('+hue+' 28% 16%)"/>'+r+'<text x="16" y="205" fill="#f2eee5" font-size="20" font-family="Georgia,serif">'+t.district+'</text></svg>'}
async function art(h,st,sh){var b=await block(h);var bb=Object.assign({},b,{hash:b.hash.split("").reverse().join("")});return {svg:paint(traits(h,bb),st,sh),b:b}}
var FEE=330,mints=[{name:"Block Gardens",desc:"Each child grows from its block's hash. Same height, same garden.",price:6000,close:0,parent:840000,st:0,sh:0},{name:"Ring Signal",desc:"Rings set by nonce and digit sum.",price:12000,close:0,parent:830000,st:1,sh:40},{name:"Strata",desc:"Layers from transaction count.",price:3500,close:0,parent:800000,st:2,sh:180}];
var mine=["840420.bitmap","812345.bitmap","777777.bitmap"],S={},C={};
function $(h){document.getElementById("app").innerHTML=h;scrollTo(0,0)}
function fmt(n){return n.toLocaleString("en-US")}
function go(v,a){document.getElementById("tb").className="tab"+(v.startsWith("c")?"":" on");document.getElementById("tc").className="tab"+(v.startsWith("c")?" on":"");V[v](a)}
async function fill(id,h,st,sh){var e=document.getElementById(id);if(!e)return;var a=await art(h,st,sh);e.innerHTML=a.svg;return a}
var V={
list:function(){$('<h1>Open mints</h1><p class="s">One price. One tap.</p>'+mints.map(function(m,i){return '<div class="card"><div id="la'+i+'" style="aspect-ratio:320/220;background:#222"></div><div class="m"><h2>'+m.name+'</h2><div class="row"><span>One price: '+fmt(m.price)+' sats</span></div><div class="row small"><span>Closes at block '+fmt(m.close)+'</span></div><button class="btn" onclick="go(\'mint\','+i+')">Mint</button></div></div>'}).join(""));mints.forEach(function(m,i){fill("la"+i,m.parent+i*111,m.st,m.sh)})},
mint:function(i){S.m=i;S.p=S.p||0;var m=mints[i],net=1200;$('<h1>'+m.name+'</h1><p class="s">'+m.desc+'</p><div class="card"><div class="m"><div class="row"><span>Price</span><span>'+fmt(m.price)+' sats</span></div><div class="row small"><span>Fee: 330-sat platform fee + ~'+fmt(net)+' network</span><span>'+fmt(FEE+net)+'</span></div><div class="row" style="font-weight:700;color:#fff"><span>Total</span><span>'+fmt(m.price+FEE+net)+' sats</span></div></div></div><p style="color:#9fd39f">✓ Your Bitmap comes back whole. The art goes on a fresh sat.</p><h2>Mint on</h2>'+mine.map(function(b,k){return '<div class="pick'+(k==S.p?' on':'')+'" onclick="S.p='+k+';go(\'mint\','+i+')">▣ '+b+'</div>'}).join("")+'<button class="btn" onclick="go(\'minted\')">Mint</button><button class="btn g" onclick="go(\'list\')">Back</button>')},
minted:function(){var m=mints[S.m],h=parseInt(mine[S.p]);$('<div class="ok">Minted.</div><p class="s">'+m.name+' · from '+mine[S.p]+'</p><div class="card"><div id="ma" style="aspect-ratio:320/220"></div><div class="m small" id="mm">Reading block '+h+'…</div></div><p style="color:#9fd39f">'+mine[S.p]+' is back in your wallet, whole.</p><button class="btn g" onclick="go(\'list\')">Done</button>');fill("ma",h,m.st,m.sh).then(function(a){document.getElementById("mm").textContent="Block "+a.b.hash.slice(0,12)+"… · bits "+a.b.bits+" · nonce "+a.b.nonce+" · "+a.b.src})},
c1:function(){C.p=C.p||0;$('<div class="steps">STEP 1 OF 6</div><h1>Deposit a parent</h1><p class="s">This Bitmap signs every mint in your collection.</p>'+mine.map(function(b,k){return '<div class="pick'+(k==C.p?' on':'')+'" onclick="C.p='+k+';go(\'c1\')">▣ '+b+'</div>'}).join("")+'<div class="warn"><b>This Bitmap will be burned</b> when the mint closes (288 blocks). You will not get it back.</div><button class="btn" onclick="go(\'c2\')">Deposit</button>')},
c2:function(){$('<div class="steps">STEP 2 OF 6</div><h1>Name it</h1><input id="n" placeholder="Collection name" value="'+(C.n||"")+'"><textarea id="d" rows="3" placeholder="One-line description">'+(C.d||"")+'</textarea><button class="btn" onclick="C.n=n.value||\'Untitled\';C.d=d.value;go(\'c3\')">Next</button><button class="btn g" onclick="go(\'c1\')">Back</button>')},
c3:function(){$('<div class="steps">STEP 3 OF 6</div><h1>Add the art</h1><p class="s">Upload code, or describe it.</p><input type="file" id="f" accept=".png,.webp,.avif,.svg,.html,.js,.glb" onchange="up(this)"><p class="small">PNG/WebP/AVIF/SVG ≤60KB · HTML/JS ≤80KB · GLB ≤100KB</p><p id="fr"></p><p class="s" style="text-align:center">— or —</p><textarea id="pr" rows="3" placeholder="e.g. neon rings pulsing with the block">'+(C.pr||"")+'</textarea><button class="btn" onclick="gen()">Generate from prompt</button><button class="btn g" onclick="go(\'c2\')">Back</button>')},
c4:function(){var hs=[840420,800000,777777,123456];$('<div class="steps">STEP 4 OF 6</div><h1>Preview</h1><p class="s">'+(C.src||"")+' — each height renders from its own block.</p><div class="grid">'+hs.map(function(h,i){return '<div class="card"><div id="p'+i+'" style="aspect-ratio:320/220;background:#222"></div><div class="m">'+h+'</div></div>'}).join("")+'</div><h2 style="margin-top:16px">Any height</h2><div class="seg"><input id="hh" type="number" inputmode="numeric" placeholder="e.g. 850000"><button class="btn" style="margin:6px 0;width:110px" onclick="var v=+hh.value;if(v>=0)fill(\'pz\',v,C.st,C.sh)">Render</button></div><div id="pz" class="card"></div><button class="btn" onclick="go(\'c5\')">Looks good</button><button class="btn g" onclick="go(\'c3\')">Back</button>');hs.forEach(function(h,i){fill("p"+i,h,C.st,C.sh)})},
c5:function(){$('<div class="steps">STEP 5 OF 6</div><h1>Set one price</h1><input id="pp" type="number" inputmode="numeric" value="'+(C.price||5000)+'"><p class="s">sats per mint. Buyers also pay a 330-sat platform fee.</p><p>Open for 288 blocks (~48h)</p><button class="btn" onclick="C.price=+pp.value||5000;go(\'c6\')">Next</button><button class="btn g" onclick="go(\'c4\')">Back</button>')},
c6:function(){$('<div class="steps">STEP 6 OF 6</div><h1>Confirm</h1><div class="card"><div class="m"><div class="row"><span>Collection</span><span>'+C.n+'</span></div><div class="row"><span>Parent</span><span>'+mine[C.p]+'</span></div><div class="row"><span>Price</span><span>'+fmt(C.price)+' sats</span></div><div class="row"><span>Closes</span><span>block '+fmt(TIP+288)+'</span></div></div></div><label class="chk"><input type="checkbox" id="ck" onchange="ob.disabled=!this.checked"><span>I understand this Bitmap is burned when the mint closes</span></label><button class="btn" id="ob" disabled onclick="openMint()">Open mint</button><button class="btn g" onclick="go(\'c5\')">Back</button>')},
done:function(){$('<div class="ok">Mint is open.</div><p style="font-size:20px">Closes at block '+fmt(TIP+288)+'.</p><button class="btn" onclick="go(\'list\')">See open mints</button>')}};
function up(i){var f=i.files[0];if(!f)return;var ext=f.name.split(".").pop().toLowerCase(),lim={png:60,webp:60,avif:60,svg:60,html:80,js:80,glb:100}[ext];var o=document.getElementById("fr");if(!lim){o.innerHTML='<span style="color:#f88">Unsupported type.</span>';return}if(f.size>lim*1024){o.innerHTML='<span style="color:#f88">'+(f.size/1024).toFixed(1)+'KB — limit is '+lim+'KB.</span>';return}C.st=0;C.sh=0;C.src="Uploaded "+f.name+" (preview uses demo renderer)";go("c4")}
function gen(){var p=document.getElementById("pr").value||"block garden";C.pr=p;var h=0;for(var i=0;i<p.length;i++)h=(h*31+p.charCodeAt(i))>>>0;C.st=/ring|circle|pulse/i.test(p)?1:/layer|strat|stripe/i.test(p)?2:h%3;C.sh=h%360;C.src='Generated from "'+p+'"';go("c4")}
function openMint(){mints.unshift({name:C.n,desc:C.d||"",price:C.price,close:TIP+288,parent:parseInt(mine[C.p]),st:C.st||0,sh:C.sh||0});go("done")}
(async function(){try{TIP=+(await (await fetch("https://mempool.space/api/blocks/tip/height")).text())}catch(e){}if(!TIP)TIP=917000;mints.forEach(function(m,i){m.close=TIP+60+i*70});var q=location.hash.slice(1);if(q==="mint"){go("mint",0)}else if(q==="minted"){S.m=0;S.p=0;go("minted")}else if(q==="c4"){C.st=1;C.sh=90;C.src="Generated from \"neon rings\"";go("c4")}else if(q==="c6"){C.n="Block Gardens";C.price=5000;C.p=0;go("c6")}else if(V[q]){go(q)}else go("list")})();
</script></body></html>
