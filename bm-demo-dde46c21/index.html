Pick an inscription you own</h2>'+inscriptionCards()+paste+vibeLink+'</div>';var vibeBox='<div class="sub"><button class="btn slim" type="button" onclick="C.kind=\'inscription\';C.ack=false;go(\'c1\')">← Pick an existing inscription instead</button><h2>Vibe a new image</h2>'+vibe+'</div>';var body=kind==="bitmap"?mine.map(function(b,k){return '<div class="pick'+(k==C.p?' on':'')+'" onclick="C.p='+k+';C.ack=false;go(\'c1\')">▣ '+b+'</div>'}).join(""):kind==="inscription"?insc:vibeBox;$('<div class="steps">STEP 1 OF 6</div><h1>Choose the collection parent</h1><p class="s">The parent signs every mint, so the price and the platform fee are enforced. Only children of this parent are valid. The collection is this parent inscription plus the launch record. The window ends at the end height either way.</p><div class="seg"><button class="btn'+(kind==="bitmap"?"":" g")+'" onclick="C.kind=\'bitmap\';C.ack=false;go(\'c1\')">A Bitmap you own</button><button class="btn'+(kind==="inscription"||kind==="vibe"?"":" g")+'" onclick="C.kind=\'inscription\';C.ack=false;go(\'c1\')">Another inscription</button></div>'+body+(blocked()?'<p class="small">'+blockedNote("create")+'</p>':'')+burnWarn()+'<label class="chk"><input type="checkbox" id="ack"'+(C.ack?' checked':'')+' onchange="C.ack=this.checked;document.getElementById(\'cb\').disabled=!this.checked"><span>I understand this inscription will be destroyed</span></label><button class="btn" id="cb"'+(C.ack?'':' disabled')+' onclick="var box=document.getElementById(\'vp\');if(box)C.vp=box.value;if(!C.ack)return;if(C.kind===\'vibe\')C.vibeId=vibeMockId();go(\'c2\')">Continue</button>')},
c2:function(){$('<div class="steps">STEP 2 OF 6</div><h1>Name it</h1><input id="n" placeholder="Collection name" value="'+esc(C.n||"")+'"><textarea id="d" rows="3" placeholder="One-line description">'+esc(C.d||"")+'</textarea><button class="btn" onclick="captureFields();C.n=C.n||\'Untitled\';go(\'c3\')">Next</button><button class="btn g" onclick="back()">Back</button>')},
c3:function(){var mode=C.artMode||"generative";var genOn=mode==="generative";var edOn=mode==="edition";var accept=genOn?GEN_ACCEPT:EDITION_ACCEPT;$('<div class="steps">STEP 3 OF 6</div><h1>Add the art</h1><p class="lead">'+DELEGATE_LINE+' <a class="more" href="#fineprint" onclick="moreInfo();return false">More info ↓</a></p><h2>Launch type</h2><div class="modes" id="launch-type"><div class="mode'+(genOn?' on':'')+'"><button class="btn'+(genOn?'':' g')+'" aria-pressed="'+genOn+'" onclick="setArtMode(\'generative\')">Unique art per mint (generative)</button><p>'+GENERATIVE_COPY+'</p><p class="fmt">'+GENERATIVE_FORMATS+'</p></div><div class="mode'+(edOn?' on':'')+'"><button class="btn'+(edOn?'':' g')+'" aria-pressed="'+edOn+'" onclick="setArtMode(\'edition\')">Same art for every mint (edition)</button><p>'+EDITION_COPY+'</p><p class="fmt">'+EDITION_FORMATS+'</p></div></div><p class="fmt">'+(edOn?"Edition launch: one file, same art on every Bitmap.":"Traits launch: each mint\'s art comes from its Bitmap\'s block.")+'</p><input type="file" id="f" accept="'+accept+'" onchange="up(this)">'+artNote()+artPrompt(mode)+rulesHtml(mode)+'<button class="btn" onclick="artNext()">Next</button><button class="btn g" onclick="back()">Back</button>'+finePrint())},
c4:function(){var hs=[89840420,89800000,89777777,89123456];$('<div class="steps">STEP 4 OF 6</div><h1>Preview</h1><p class="s">'+(C.src||"")+' — each height renders from its own block.</p><div class="grid">'+hs.map(function(h,i){return '<div class="card"><div id="p'+i+'">'+previewSvg(h,C.st,C.sh)+'</div><div class="m">'+h+'</div></div>'}).join("")+'</div><button class="btn" onclick="go(\'c5\')">Looks good</button><button class="btn g" onclick="back()">Back</button>')},
c5:function(){var price=C.price==null?20000:C.price;var royalty=C.royalty==null?2.5:C.royalty;var shown=allIn(price);var priceText=buyerPayText(price);var priceFx=shown==null?"":conversionLine(price);$('<div class="steps">STEP 5 OF 6</div><h1>Set one price</h1><p class="s">You keep 100% of your mint price.</p><label class="small">Mint price (sats)</label><div class="field"><input id="pp" type="number" inputmode="numeric" value="'+price+'" oninput="paintPrice()"><span class="suf">sats</span></div><p id="pfx" class="muted">'+priceFx+'</p><p id="allin">'+priceText+'</p><label class="small">Resale royalty (%)</label><div class="field"><input id="ry" type="number" inputmode="decimal" min="0" max="5" step="0.1" placeholder="2.5" value="'+royalty+'" oninput="paintRoyalty()"><span class="suf">%</span></div><p>When a holder resells, you earn this % of the sale price. Set 0 to 5%, default 2.5%. Paid by the seller.</p><p id="ryex">'+royaltyExample(royalty)+'</p><p class="fine">Royalties under 330 sats go to the seller instead.</p><p>Open for 1,008 blocks (~7 days).</p><p>Your parent inscription is sent to the project wallet at launch and permanently burned after the mint closes. You will not get it back.</p><p>'+whyBurn()+'</p><button class="btn" onclick="var p=pp.value;if(allIn(p)==null){paintPrice();return}var r=royaltyPercent(ry.value);if(r==null){paintRoyalty();return}C.price=+p;C.royalty=r;go(\'c6\')">Next</button><button class="btn g" onclick="back()">Back</button>')},
c6:function(){var royalty=C.royalty==null?2.5:C.royalty;$('<div class="steps">STEP 6 OF 6</div><h1>Send the parent to the project wallet</h1><div class="card"><div class="m"><div class="row"><span>Collection</span><span>'+esc(C.n||"")+'</span></div><div class="row"><span>Parent</span><span>'+esc(parentLabel())+'</span></div><div class="row"><span>Mint for</span><span>'+fmt(allIn(C.price))+' sats</span></div><div class="row"><span>You keep</span><span>'+fmt(C.price)+' sats</span></div><div class="row"><span>Resale royalty</span><span>'+royalty+'%</span></div><div class="row"><span>Launch type</span><span>'+((C.artMode||"generative")==="edition"?"Edition":"Traits")+'</span></div><div class="row"><span>Mints per Bitmap</span><span>'+(C.k||1)+'</span></div><div class="row"><span>Bitmap blocks</span><span>'+esc(C.lo===""?"0":C.lo)+(C.hi===""?" up":"–"+esc(C.hi))+'</span></div>'+(Object.keys(fieldsObject()).length&&(C.artMode||"generative")!=="edition"?'<div class="row"><span>Extra fields</span><span>'+esc(Object.keys(fieldsObject()).map(function(k){return k+" = "+fieldsObject()[k]}).join(", "))+'</span></div>':"")+'<div class="row"><span>Closes</span><span>block '+fmt(tipLive+WINDOW_BLOCKS)+'</span></div></div></div><p class="s">You keep 100% of your mint price.</p>'+burnWarn()+'<p class="s">Signing summary: this inscription is sent to the project wallet. You do not keep a key. After the mint closes the project burns it.</p><p>'+whyBurn()+'</p><input id="bp" placeholder="First 8 characters, or BURN" value="'+esc(C.burnPhrase||"")+'" oninput="C.burnPhrase=this.value;ob.disabled=!burnOk()||blocked()">'+(blocked()?'<p class="small">'+blockedNote("open")+'</p>':'')+'<button class="btn" id="ob"'+(burnOk()&&!blocked()?'':' disabled')+' onclick="openMint()">Open mint</button><button class="btn g" onclick="back()">Back</button>')},
done:function(){enterMints()},
cols:function(){var local=mints.concat(closedShows).map(function(m){var i=mints.indexOf(m);var goTo=i>=0?"go('mint',"+i+")":"go('col','"+m.id+"')";var st=statusText(m);return '<div class="card">'+coverHtml(m)+'<div class="m"><h2>'+esc(m.name)+tagFor(m)+'</h2>'+phasePill(m)+'<p>'+st+'</p>'+(st.indexOf("Minted so far")>=0?"":'<p class="fine">Minted so far: '+fmt(m.minted||0)+'</p>')+lockHtml(lockFor(m),true)+'<button class="btn g" onclick="'+goTo+'">Open</button></div></div>'}).join("");$('<h1>Collections</h1><p class="s">Countdown and supply on every collection.</p><div class="mgrid">'+local+'</div>'+'<p class="fine">Testnet demo. Every collection here is a made-up sample. This page does not call mempool.space and does not broadcast.</p>');loadCatalog().then(function(cat){var host=document.getElementById("app");if(!host||currentView.v!=="cols")return;var extra=(cat.collections||[]).map(function(c){return '<div class="card"><div class="m"><h2>'+esc(c.name)+(c.sample?' '+SAMPLE_TAG:'')+'</h2><p>'+esc(c.status)+'</p></div></div>'}).join("");host.insertAdjacentHTML?host.insertAdjacentHTML("beforeend",extra):host.innerHTML+=extra})},
col:function(id){var m=closedShows.filter(function(row){return row.id===id})[0]||closedShows[0];$( '<div class="hero">'+coverHtml(m)+'<div class="facts"><h1>'+esc(m.name)+tagFor(m)+'</h1>'+phasePill(m)+'<p class="s">'+esc(m.desc)+'</p>'+lockHtml(lockFor(m))+'<p class="fine">by '+esc(m.creator)+'</p></div></div>')},
mkt:function(){$('<h1>Marketplace</h1><p class="s">The buyer pays the price. The seller pays max(1,000 sats, 2.5%) and the creator royalty. A royalty under 330 sats goes to the seller. The lowest listing is 1,330 sats. This page does not broadcast.</p><div class="card"><div class="m"><h2>Sample Chalk '+SAMPLE_TAG+'</h2><p>4,000 sats · filled</p><p class="fine">Supply locked forever: the parent is burned.</p><button class="btn g" onclick="go(\'listing\')">View listing</button></div></div>')},
listing:function(){var row=SAMPLE_CATALOG.listings[0];$('<h1>Sample Chalk '+SAMPLE_TAG+'</h1><p>4,000 sats</p>'+lockHtml(supplyLock({tip:SAMPLE_CATALOG.tip,endHeight:0,minted:1,phase:"burned",burnTxid:SAMPLE_CATALOG.collections[0].mints[0].txid}))+'<p class="fine">Listing '+idChip(row.id)+'</p><p class="fine">Inscription '+idChip(row.inscriptionId)+'</p><p class="s">Sample legacy sale. This page does not broadcast. You can cancel a listing before it sells.</p><p class="fine">Fees are enforced by this marketplace, not by Bitcoin. Another market may skip them.</p>')},
how:function(){var tab=S.how||"collectors";var supplyOpen=currentView.a==="supply"?" open":"";$('<h1>How it works</h1><p class="mocktag">Testnet demo</p><p class="s">Nothing here is real Bitcoin. Collectors, sellers, and creators each get a short version.</p><div class="chips"><button class="btn'+(tab==="collectors"?"":" g")+'" onclick="S.how=\'collectors\';show(\'how\')">Collectors</button><button class="btn'+(tab==="sellers"?"":" g")+'" onclick="S.how=\'sellers\';show(\'how\')">Sellers</button><button class="btn'+(tab==="creators"?"":" g")+'" onclick="S.how=\'creators\';show(\'how\')">Creators</button></div><div class="timeline"><div class="tstep"><b>Launch</b>Parent goes to the project wallet.</div><div class="tstep"><b>Mint open</b>1,008 blocks, about 7 days.</div><div class="tstep"><b>Closed</b>Closed: awaiting burn.</div><div class="tstep"><b>Supply locked</b>Parent burned.</div></div>'+(tab==="collectors"?'<details open><summary>For collectors</summary><ol><li>You need a Bitmap. A creator can limit which ones, for example heights containing 420. One mint per Bitmap. The first valid one wins.</li><li>Your Bitmap comes back whole. The art goes on a fresh sat. It stays tied to that Bitmap by a parent tag and the block height. Generative traits come from that block.</li><li>Cost is the mint price plus a platform fee of max(1,000 sats, 5%), shown before you sign.</li><li>The mint is open for 1,008 blocks (~7 days), then it closes.</li></ol></details><div class="lock" role="note"><b>Supply locks when the mint closes</b><p>After the end block (about 7 days after launch), the collection\'s parent is burned on-chain, so no more can ever be minted — not even by the creator. Everything minted before close is the entire collection forever.</p></div><details id="supply-lock"'+supplyOpen+'><summary>Supply lock</summary><p>While the mint is open: Supply locks when this mint closes. After close: Mint closed. Supply is locking: the parent burn is pending. After the burn: Supply locked forever, with the burn transaction as proof.</p><p>After close, the team burns the parent. Open the burn transaction on the collection and check that the parent sat moved to an output nobody can spend. That is how you check the burn yourself.</p><p>An edition is the same file every time. A generative mint needs a script, so each Bitmap looks different.</p></details>':"")+(tab==="sellers"?'<details open><summary>For sellers</summary><ol><li>You can sell the mint, or sell the piece later.</li><li>Seller fees are a platform fee of max(1,000 sats, 2.5%) plus a creator royalty from 0 to 5% (default 2.5%).</li><li>On a 100,000 sat sale the platform fee is 2,500 sats and a 2.5% royalty is 2,500 sats. The seller keeps 95,000 sats.</li><li>Royalties under 330 sats go to the seller. The lowest listing is 1,330 sats.</li><li>These fees are enforced by this marketplace, not by Bitcoin. Another market may skip them.</li><li>You can cancel a listing before it sells.</li></ol></details>':"")+(tab==="creators"?'<details open><summary>For creators</summary><ol><li>Choose a parent: a Bitmap, another inscription, or a vibe or upload.</li><li>The parent is sent to the project wallet and burned after close to lock supply. You will not get it back. '+SUPPLY_LOCK+'</li><li>'+EDITION_COPY+' '+GENERATIVE_COPY+' '+DELEGATE_LINE+'</li><li>Hard limit about 390KB, with a warning over 100KB. PNG, WebP, GIF, GLB, or HTML. '+WORLDS_TIP+'</li><li>You keep 100% of the mint price. Royalty is 0 to 5%, default 2.5%.</li><li>Timeline: launch, open about 7 days, closed and awaiting burn, then burned and supply locked.</li></ol></details>':"")+'<h2>Glossary</h2><details><summary>Bitmap</summary><p>A block height you hold, written as the height followed by .bitmap.</p></details><details><summary>Inscription</summary><p>A file stored in a Bitcoin transaction.</p></details><details><summary>Parent and child</summary><p>The parent defines the collection. A child is one mint.</p></details><details><summary>Delegate</summary><p>A tiny pointer to a file that was inscribed once.</p></details><details><summary>Burn</summary><p>'+SUPPLY_LOCK+'</p></details><details><summary>Sats</summary><p>The small unit of Bitcoin. One bitcoin is 100,000,000 sats.</p></details>')}};
function up(i){var f=i.files&&i.files[0];if(!f)return;var ext=(f.name.split(".").pop()||"").toLowerCase();var kind=({png:"image",webp:"image",gif:"image",avif:"image",svg:"image",glb:"model",html:"html",htm:"html"})[ext];C.artErr="";if(!kind){C.artErr="Unsupported type.";C.fileBytes=0;show("c3");return}if((C.artMode||"generative")==="generative"&&kind!=="html"){C.artErr="A single image cannot do this.";C.fileBytes=0;show("c3");return}if(f.size>390000){C.artErr="Over the 390KB hard limit.";C.fileBytes=f.size;show("c3");return}C.fileBytes=f.size;C.fileName=f.name;C.promptOnly=false;C.st=0;C.sh=0;C.src="Uploaded "+f.name;show("c3")}
function gen(){var node=document.getElementById("pr");var p=(node&&node.value)||"block garden";C.pr=p;if((C.artMode||"generative")==="edition"){C.promptOnly=true;C.src="Preview only";show("c3");return}var h=0;for(var i=0;i<p.length;i++)h=(h*31+p.charCodeAt(i))>>>0;C.st=/ring|circle|pulse/i.test(p)?1:/layer|strat|stripe/i.test(p)?2:h%3;C.sh=h%360;C.promptOnly=false;C.src='Generated from "'+p+'"';go("c4")}
function artNext(){captureFields();C.rulesErr=rulesProblem();if(C.rulesErr){show("c3");return}if((C.artMode||"generative")==="edition"&&(C.promptOnly||!C.fileBytes)){C.artErr="Edition mode needs the file itself. The prompt is a preview only.";show("c3");return}if((C.artMode||"generative")==="generative"&&!C.fileBytes&&!C.src){C.artErr="Add an HTML script.";show("c3");return}go("c4")}
async function doMint(){if(!canMintNow(mints[S.m])){wallet.note="This mint window has closed.";paintWallet();return}try{await maybeSign("mint");go("minted")}catch(error){wallet.note=error.message;paintWallet()}}
function paintPrice(){var raw=document.getElementById("pp").value;var n=allIn(raw);var el=document.getElementById("allin");var fx=document.getElementById("pfx");if(fx)fx.textContent=n==null?"":conversionLine(raw);if(el)el.textContent=buyerPayText(raw)}
function paintRoyalty(){var node=document.getElementById("ryex");var raw=document.getElementById("ry").value;if(!node)return;node.className=royaltyPercent(raw)==null?"warn":"";node.textContent=royaltyExample(raw)}
async function openMint(){if(blocked()||!burnOk())return;try{await maybeSign("deposit")}catch(error){wallet.note=error.message;paintWallet();return}var parent=C.kind==="bitmap"?parseInt(mine[C.p]):89840000;mints.unshift({name:C.n||"Untitled",desc:C.d||"",price:C.price,close:tipLive+WINDOW_BLOCKS-1,parent:parent,st:C.st||0,sh:C.sh||0,phase:"open",minted:0,media:C.artMode==="generative"?"html":"image",filter:"all",creator:"sample-creator",perBitmap:C.k||1,minH:C.lo===""?0:Number(C.lo),maxH:C.hi===""?null:Number(C.hi),used:[],mintedItems:[]});C.burnPhrase="";enterMints()}
function hashTarget(q){var mm=/^mint\/([0-9]+)$/.exec(q);if(mm&&mints[Number(mm[1])])return{v:"mint",a:Number(mm[1])};if(q==="mint"||q==="list"||q==="")return{v:"list",a:null};if(q==="cd-open"||q==="gallery")return{v:"mint",a:0};if(q==="picker")return{v:"mint",a:3};if(q==="cd-await"||q==="awaiting")return{v:"col",a:"harbor"};if(q==="cd-burned"||q==="burned")return{v:"col",a:"ember"};if(q==="edition"){if(C.artMode!=="edition"){C.artErr="";C.fileBytes=0;C.src=""}C.artMode="edition";return{v:"c3",a:null}}if(q==="generative"){if(C.artMode!=="generative"){C.artErr="";C.fileBytes=0;C.src=""}C.artMode="generative";return{v:"c3",a:null}}if(q==="c3")return{v:"c3",a:null};if(q==="c5"||q==="step5")return{v:"c5",a:null};if(q==="c6"){C.n="Block Gardens";C.price=20000;C.royalty=2.5;return{v:"c6",a:null}}if(q==="vibe"){C.kind="vibe";C.vp="a chalk grid that shifts with the block hash";return{v:"c1",a:null}}if(q==="inscription"){C.kind="inscription";return{v:"c1",a:null}}if(q==="supply-lock")return{v:"how",a:"supply"};if(q==="how-sellers")return{v:"how",a:"sellers"};if(q==="how-creators")return{v:"how",a:"creators"};if(q==="how")return{v:"how",a:"collectors"};if(q==="solo")return{v:"solo"};if(q==="empty")return{v:"empty"};if(q==="done")return{v:"list",a:null};if(V[q])return{v:q,a:null};return{v:"list",a:null}}
function boot(){TIP=89917000;tipLive=TIP;mints.forEach(function(m,i){m.close=TIP+WINDOW_BLOCKS-1-i*120});closedShows[0].close=TIP-20;closedShows[1].close=TIP-400;upcoming.start=TIP+48;wallet.note="No wallet yet. Connect UniSat on signet or testnet4, or stay in mock mode. All heights, ids and transactions here are made-up samples that do not exist on any network. This page does not call mempool.space.";var q=(location.hash||"").replace(/^#/,"");if(q==="solo"){mints.forEach(function(m,i){if(i>0)m.phase="awaiting"})}if(q==="empty"){mints.forEach(function(m){m.phase="awaiting"})}var target=hashTarget(q==="solo"||q==="empty"?"list":q);var chain=[{v:"list",a:null}];if(target.v==="c2")chain=[{v:"c1"},{v:"c2"}];else if(target.v==="c3")chain=[{v:"c1"},{v:"c2"},{v:"c3"}];else if(target.v==="c4")chain=[{v:"c1"},{v:"c2"},{v:"c3"},{v:"c4"}];else if(target.v==="c5")chain=[{v:"c1"},{v:"c2"},{v:"c3"},{v:"c4"},{v:"c5"}];else if(target.v==="c6")chain=[{v:"c1"},{v:"c2"},{v:"c3"},{v:"c4"},{v:"c5"},{v:"c6"}];else if(target.v!=="list")chain=[{v:"list",a:null},{v:target.v,a:target.a}];var h=navHistory();h.replaceState(chain[0],"","#"+chain[0].v);for(var i=1;i<chain.length;i++)h.pushState({v:chain[i].v,a:chain[i].a==null?null:chain[i].a},"","#"+chain[i].v+(chain[i].v==="mint"&&chain[i].a!=null?"/"+chain[i].a:""));show(target.v,target.a);if(typeof setInterval==="function")setInterval(tickTip,8000)}
boot();
</script>
