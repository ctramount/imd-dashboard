<script>
// Traits: same function as the prototype renderer (src/traits.ts); paint adapted from src/renderer.ts
function traits(height, block){var digits=String(height).split("");var sum=0;for(var i=0;i<digits.length;i++)sum+=Number(digits[i]);var text=String(height);var reversed=text.split("").reverse().join("");var hash=String(block.hash||"").toLowerCase();if(!/^[0-9a-f]{64}$/.test(hash))hash="0".repeat(64);function byteAt(i){return parseInt(hash.substr(i*2,2),16)}var tx=Number(block.transaction_count)||0;var ts=Number(block.timestamp)||0;var year=new Date(ts*1000).getUTCFullYear();var motifs=["grid","rings","strata","glyph","pulse"];var inks=["chalk","amber","tide","ember","moss"];var density=tx<2?"quiet":tx<50?"settled":tx<500?"busy":"roaring";return{district:text+".bitmap",height:height,digitSum:sum,palindrome:text===reversed,contains420:text.indexOf("420")!==-1,leadingDigit:Number(digits[0]),era:year,density:density,motif:motifs[byteAt(0)%5],ink:inks[byteAt(1)%5],hue:byteAt(2),accent:byteAt(3),cells:(byteAt(4)%5)+3,txCount:tx,hashPrefix:hash.slice(0,8),bits:block.bits,nonce:block.nonce}}

;async function block(h){if(cache[h])return cache[h];if(EMBEDDED[h]){cache[h]=EMBEDDED[h];return cache[h]}var s=seeded(h);s.src="seeded (no network)";cache[h]=s;return cache[h]}
function paint(t,st,shift){st=st||0;shift=shift||0;var hue=(Math.round(t.hue*360/255)+shift)%360,ac=(Math.round(t.accent*360/255)+shift)%360,c=t.cells,r="";

async function art(h,st,sh){var b=await block(h);var bb=Object.assign({},b,{hash:b.hash.split("").reverse().join("")});return {svg:paint(traits(h,bb),st,sh),b:b}}

function royaltyPercent(value){if(value===""||value==null)return 2.5;var n=Number(value);if(!isFinite(n))return null;var tenths=n*10;if(Math.abs(tenths-Math.round(tenths))>1e-8)return null;var exact=Math.round(tenths)/10;if(exact<0||exact>5)return null;return exact}

function refuseChain(parsed){wallet={mode:parsed.mainnet?"mainnet":"refused",note:parsed.note,address:"",publicKey:"",chain:"",psbt:""};paintWallet();go("list")}

mint:function(i){if(blocked()){go("list");return}S.m=i;S.p=S.p||0;var m=mints[i],net=1200,due=allIn(m.price);$('<h1>'+m.name+'</h1><p class="s">'+m.desc+'</p><div class="card"><div class="m"><div class="row" style="font-weight:700;color:#fff"><span>Mint for '+fmt(due)+' sats</span></div><div class="row small"><span>Network fee is extra, about '+fmt(net)+' sats.</span></div></div></div><p style="color:#9fd39f">✓ Your Bitmap comes back whole. The art goes on a fresh sat.</p><h2>Mint on</h2>'+mine.map(function(b,k){return '<div class="pick'+(k==S.p?' on':'')+'" onclick="S.p='+k+';go(\'mint\','+i+')">▣ '+b+'</div>'}).join("")+'<button class="btn" onclick="doMint()">Mint for '+fmt(due)+' sats</button><button class="btn g" onclick="go(\'list\')">Back</button>')},
minted:function(){var m=mints[S.m],label=mine[S.p]||"0.bitmap",h=parseInt(label)||0;$('<div class="ok">Minted.</div><p class="s">'+m.name+' · from '+label+'</p><div class="card"><div id="ma" style="aspect-ratio:320/220"></div><div class="m small" id="mm">Reading block '+h+'…</div></div><p style="color:#9fd39f">'+label+' is back in your wallet, whole.</p><button class="btn g" onclick="go(\'list\')">Done</button>');fill("ma",h,m.st,m.sh).then(function(a){var node=document.getElementById("mm");if(node)node.textContent="Block "+a.b.hash.slice(0,12)+"… · bits "+a.b.bits+" · nonce "+a.b.nonce+" · "+a.b.src})},
c1:function(){C.p=C.p||0;C.o=C.o||0;var bitmap=C.kind!=="inscription";$('<div class="steps">STEP 1 OF 6</div><h1>Choose the collection parent</h1><p class="s">The parent signs every mint, so the price and the platform fee are enforced. Only children of this parent are valid. The collection is this parent inscription plus the launch record. The window ends at the end height either way.</p><div class="seg"><button class="btn'+(bitmap?"":" g")+'" onclick="C.kind=\'bitmap\';go(\'c1\')">A Bitmap you own</button><button class="btn'+(bitmap?" g":"")+'" onclick="C.kind=\'inscription\';go(\'c1\')">Another inscription</button></div>'+(bitmap?mine.map(function(b,k){return '<div class="pick'+(k==C.p?' on':'')+'" onclick="C.p='+k+';go(\'c1\')">▣ '+b+'</div>'}).join("")+'<div class="warn"><b>This Bitmap is burned</b> when the mint closes. You will not get it back.</div>':others.map(function(b,k){return '<div class="pick'+(k==C.o?' on':'')+'" onclick="C.o='+k+';go(\'c1\')">▣ '+b.label+'</div>'}).join("")+'<div class="warn"><b>This inscription comes back to you</b> when the mint closes. It is not burned. The window still ends at that block.</div>')+(blocked()?'<p class="small">Your wallet is on mainnet, so this walkthrough uses mock inscriptions. Opening the mint stays blocked until you switch to signet or testnet4.</p>':'')+'<button class="btn" onclick="go(\'c2\')">Continue</button>')},
c2:function(){$('<div class="steps">STEP 2 OF 6</div><h1>Name it</h1><input id="n" placeholder="Collection name" value="'+(C.n||"")+'"><textarea id="d" rows="3" placeholder="One-line description">'+(C.d||"")+'</textarea><button class="btn" onclick="C.n=n.value||\'Untitled\';C.d=d.value;go(\'c3\')">Next</button><button class="btn g" onclick="go(\'c1\')">Back</button>')},
c3:function(){$('<div class="steps">STEP 3 OF 6</div><h1>Add the art</h1><p class="s">Upload code, or describe it.</p><input type="file" id="f" accept=".png,.webp,.avif,.svg,.html,.js,.glb" onchange="up(this)"><p class="small">PNG/WebP/AVIF/SVG ≤60KB · HTML/JS ≤80KB · GLB ≤100KB</p><p id="fr"></p><p class="s" style="text-align:center">— or —</p><textarea id="pr" rows="3" placeholder="e.g. neon rings pulsing with the block">'+(C.pr||"")+'</textarea><button class="btn" onclick="gen()">Generate from prompt</button><button class="btn g" onclick="go(\'c2\')">Back</button>')},
c4:function(){var hs=[840420,800000,777777,123456];$('<div class="steps">STEP 4 OF 6</div><h1>Preview</h1><p class="s">'+(C.src||"")+' — each height renders from its own block.</p><div class="grid">'+hs.map(function(h,i){return '<div class="card"><div id="p'+i+'" style="aspect-ratio:320/220;background:#222"></div><div class="m">'+h+'</div></div>'}).join("")+'</div><h2 style="margin-top:16px">Any height</h2><div class="seg"><input id="hh" type="number" inputmode="numeric" placeholder="e.g. 850000"><button class="btn" style="margin:6px 0;width:110px" onclick="var v=+hh.value;if(v>=0)fill(\'pz\',v,C.st,C.sh)">Render</button></div><div id="pz" class="card"></div><button class="btn" onclick="go(\'c5\')">Looks good</button><button class="btn g" onclick="go(\'c3\')">Back</button>');hs.forEach(function(h,i){fill("p"+i,h,C.st,C.sh)})},
c5:function(){var price=C.price==null?20000:C.price;var royalty=C.royalty==null?2.5:C.royalty;var line=C.kind==="inscription"?"Open for 288 blocks (~48h). This inscription comes back to you. It is not burned.":"Open for 288 blocks (~48h). The parent Bitmap is burned.";var shown=allIn(price);$('<div class="steps">STEP 5 OF 6</div><h1>Set one price</h1><input id="pp" type="number" inputmode="numeric" value="'+price+'" oninput="var raw=this.value;var n=allIn(raw);var el=document.getElementById(\'allin\');if(el)el.textContent=raw===\'\'?\'Enter a price.\':n==null?\'Price must be 0 or at least 330 sats.\':\'Buyers mint for \'+fmt(n)+\' sats.\'"><p class="s">You keep 100% of your mint price.</p><p id="allin">'+(shown==null?"Price must be 0 or at least 330 sats.":"Buyers mint for "+fmt(shown)+" sats.")+'</p><p class="s">Resale royalty, 0–5%. The seller pays it. Default 2.5%. A royalty under 330 sats goes to the seller.</p><input id="ry" type="number" inputmode="decimal" min="0" max="5" step="0.1" value="'+royalty+'" oninput="var err=document.getElementById(\'ryerr\');if(!err)return;var raw=this.value;if(raw.trim()===\'\'){err.textContent=\'\';err.className=\'s\';return}var r=royaltyPercent(raw);err.className=r==null?\'warn\':\'s\';err.textContent=r==null?\'Royalty must be a multiple of 0.1%, from 0 to 5.\':\'\';"><p id="ryerr" class="s"></p><p>'+line+'</p><button class="btn" onclick="var p=pp.value;var due=document.getElementById(\'allin\');if(allIn(p)==null){if(due)due.textContent=p===\'\'?\'Enter a price.\':\'Price must be 0 or at least 330 sats.\';return}var r=royaltyPercent(ry.value);var err=document.getElementById(\'ryerr\');if(r==null){if(err){err.className=\'warn\';err.textContent=\'Royalty must be a multiple of 0.1%, from 0 to 5.\';}return}C.price=+p;C.royalty=r;go(\'c6\')">Next</button><button class="btn g" onclick="go(\'c4\')">Back</button>')},
c6:function(){var back=C.kind==="inscription";var royalty=C.royalty==null?2.5:C.royalty;$('<div class="steps">STEP 6 OF 6</div><h1>Confirm</h1><div class="card"><div class="m"><div class="row"><span>Collection</span><span>'+C.n+'</span></div><div class="row"><span>Parent</span><span>'+parentLabel()+'</span></div><div class="row"><span>Close</span><span>'+(back?"Returned":"Burned")+'</span></div><div class="row"><span>Mint for</span><span>'+fmt(allIn(C.price))+' sats</span></div><div class="row"><span>You keep</span><span>'+fmt(C.price)+' sats</span></div><div class="row"><span>Resale royalty</span><span>'+royalty+'%</span></div><div class="row"><span>Closes</span><span>block '+fmt(TIP+288)+'</span></div></div></div><p class="s">You keep 100% of your mint price.</p><label class="chk"><input type="checkbox" id="ck" onchange="ob.disabled=!this.checked||blocked()"><span>'+(back?"I understand this inscription is returned at mint close and the window still ends there.":"I understand this Bitmap is burned when the mint closes")+'</span></label>'+(blocked()?'<p class="small">Mainnet wallet: switch UniSat to signet or testnet4 to open the mint.</p>':'')+'<button class="btn" id="ob" disabled onclick="openMint()">Open mint</button><button class="btn g" onclick="go(\'c5\')">Back</button>')},
done:function(){$('<div class="ok">Mint is open.</div><p style="font-size:20px">Closes at block '+fmt(TIP+288)+'.</p><button class="btn" onclick="go(\'list\')">See open mints</button>')},
cols:function(){$('<h1>Collections</h1><p class="s">Loading the test-network index…</p>');loadCatalog().then(renderCols)},
mkt:function(){$('<h1>Marketplace</h1><p class="s">Loading listings…</p>');loadCatalog().then(renderMarket)}};
function up(i){var f=i.files[0];if(!f)return;var ext=f.name.split(".").pop().toLowerCase(),lim={png:60,webp:60,avif:60,svg:60,html:80,js:80,glb:100}[ext];var o=document.getElementById("fr");if(!lim){o.innerHTML='<span style="color:#f88">Unsupported type.</span>';return}if(f.size>lim*1024){o.innerHTML='<span style="color:#f88">'+(f.size/1024).toFixed(1)+'KB — limit is '+lim+'KB.</span>';return}C.st=0;C.sh=0;C.src="Uploaded "+f.name+" (preview uses demo renderer)";go("c4")}
function gen(){var p=document.getElementById("pr").value||"block garden";C.pr=p;var h=0;for(var i=0;i<p.length;i++)h=(h*31+p.charCodeAt(i))>>>0;C.st=/ring|circle|pulse/i.test(p)?1:/layer|strat|stripe/i.test(p)?2:h%3;C.sh=h%360;C.src='Generated from "'+p+'"';go("c4")}
async function doMint(){try{await maybeSign("mint");go("minted")}catch(error){wallet.note=error.message;paintWallet()}}
async function openMint(){if(blocked())return;try{await maybeSign("deposit")}catch(error){wallet.note=error.message;paintWallet();return}var parent=C.kind==="inscription"?840000:parseInt(mine[C.p]);mints.unshift({name:C.n,desc:C.d||"",price:C.price,close:TIP+288,parent:parent,st:C.st||0,sh:C.sh||0});go("done")}
(async function(){TIP=917000;mints.forEach(function(m,i){m.close=TIP+60+i*70});wallet.note="No wallet yet. Connect UniSat on signet or testnet4, or stay in mock mode. Block headers are embedded. This page does not call mempool.space.";var q=location.hash.slice(1);if(q==="mint"){go("mint",0)}else if(q==="minted"){S.m=0;S.p=0;go("minted")}else if(q==="c4"){C.st=1;C.sh=90;C.src="Generated from \"neon rings\"";go("c4")}else if(q==="c6"){C.n="Block Gardens";C.price=20000;C.royalty=2.5;C.p=0;go("c6")}else if(V[q]){go(q)}else go("list")})();
</script></body></html>
