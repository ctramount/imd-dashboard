  const getBlockHeight = async (/** @type {string|null} */ ownId, /** @type {any} */ net) => {

      const q = qs.get('height');
      if (q && /^\d+$/.test(q)) { VALIDITY.state = 'preview'; VALIDITY.note = 'PREVIEW OVERRIDE'; return q; }

      try { text = (await getText(content(pid))).trim(); } catch (e) { continue; }

      if (!m) continue;
      const h = Number(m[1]);
      try {
        const tip = parseInt(String(await getText('/r/blockheight')).replace(/[^0-9]/g, ''), 10);

        try {
          const oci = await import(content(net.oci));

          else { VALIDITY.state = 'unvalidated'; VALIDITY.note = 'OCI HAS NO ENTRY'; }
        } catch (e) {
          if (VALIDITY.state === 'duplicate') throw e;
          VALIDITY.state = 'unvalidated'; VALIDITY.note = 'OCI UNAVAILABLE';
        }
      } else { VALIDITY.state = 'unvalidated'; VALIDITY.note = net.oci ? 'ABOVE OCI RANGE' : 'NO OCI ON THIS NETWORK'; }
      return String(h);
    }
    // Not a Bitmap parent: v1 fallback, the first parent's inscription height.
    if (parentIds[0]) {
      const info = await getJSON(`/r/inscription/${parentIds[0]}`);
      if (info && info.height != null) { VALIDITY.state = 'unvalidated'; VALIDITY.note = 'PARENT IS NOT A BITMAP'; return String(info.height); }
    }
    throw new Error('Could not determine block height from parent');
  };

      const id = t ? assetId(net, t) : '';
      if (id) { el.setAttribute('src', content(id)); el.setAttribute('anim', content(id)); }
      if (!['shoes', 'body1', 'body2', 'body3', 'body4', 'body5'].includes(el.id)) el.setAttribute('visible', String(on.has(el.id)));
    });
  };

  /** MML host? (networked-dom/jsdom server, or a client that already registered m-* elements). */
  const isMMLHost = () => {
    try {
      if (window.customElements && (customElements.get('m-model') || customElements.get('m-group'))) return true;
      if (/jsdom|mml/i.test(navigator.userAgent || '')) return true;
      if (typeof WebGLRenderingContext === 'undefined') return true; // no way to render 3D here anyway
    } catch (e) { return true; }
    return false;
  };

  /* ======================= STANDALONE 3D VIEW ======================= */
  /** @type {HTMLDivElement|null} */ let overlay = null;
  const ui = () => {
    if (overlay) return overlay;
    const st = document.createElement('style');
    st.textContent = 'html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}'
      + '#bf-o{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;'
      + 'font:600 14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#cfe8d0;text-align:center;padding:24px;box-sizing:border-box;pointer-events:none}'
      + '#bf-o b{font-size:22px;color:#7ee081;letter-spacing:.08em}#bf-o.err b{color:#ff8a7a}#bf-o small{opacity:.7;max-width:46em;word-break:break-word}'
      + '#bf-b{position:fixed;left:10px;bottom:8px;font:600 11px ui-monospace,Menlo,monospace;color:#9fb3a0;pointer-events:none}'
      + 'canvas{display:block;width:100vw;height:100vh;touch-action:none}';
    document.head.appendChild(st);
    overlay = document.createElement('div'); overlay.id = 'bf-o';
    document.body.appendChild(overlay);
    return overlay;
  };
  const say = (/** @type {string} */ title, /** @type {string} */ sub = '', err = false) => {
    const o = ui(); o.className = err ? 'err' : ''; o.style.display = 'flex';
    o.innerHTML = ''; const b = document.createElement('b'); b.textContent = title; const s = document.createElement('small'); s.textContent = sub;
    o.append(b, document.createElement('br'), s);
    document.title = `BlockFrogs · ${title}`;
  };
  const fail = (/** @type {any} */ e) => { console.error(e); say('FROG DID NOT LOAD', String((e && e.message) || e), true); };

  const renderThree = async (/** @type {any} */ net, /** @type {string} */ blockHeight, /** @type {{part:string,color?:string}[]} */ traits) => {
    if (!net.three || !net.loaders) throw new Error('three.js / loader inscription ids are not configured for this network');
    say('LOADING FROG', `${blockHeight}.bitmap`);
    // Bare "three" (used by the loader bundle) -> on-chain three.module via an import map, added before any module loads.
    const im = document.createElement('script'); im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: { three: content(net.three) } });
    document.head.appendChild(im);
    const THREE = await import(content(net.three));
    const { GLTFLoader, MeshoptDecoder, RoomEnvironment } = await import(content(net.loaders));

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xdff5ff, 0x203020, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 3); scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fd8ff, 0.8); rim.position.set(-3, 2, -2); scene.add(rim);

    const { scale, y } = __bfPreview.size(getSize(blockHeight), blockHeight); /*PREVIEW HOOK*/
    const frog = new THREE.Group(); frog.scale.setScalar(Number(scale)); frog.position.y = Number(y); scene.add(frog);
    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    /** @type {any[]} */ const mixers = [];
    const want = traits.map((t) => ({ t, id: assetId(net, t) }));
    const missing = want.filter((w) => !w.id).map((w) => w.t.part + (w.t.color ? `_${w.t.color}` : ''));
    const results = await Promise.allSettled(want.filter((w) => w.id).map(async ({ t, id }) => {
      const g = await loader.loadAsync(content(id));
      if (t.part === 'ufo') g.scene.position.y = 0.05; // mirrors y="0.05" on the m-model
      g.scene.userData.bfCore = /^(shoes|body\d)$/.test(t.part);
      frog.add(g.scene);
      if (g.animations && g.animations.length) {
        const mx = new THREE.AnimationMixer(g.scene); g.animations.forEach((c) => mx.clipAction(c).play()); mixers.push(mx);
      }
    }));
    const failed = results.filter((r) => r.status === 'rejected').length;
    if (!frog.children.length) throw new Error(`No GLB could be loaded (${failed} failed, ${missing.length} not inscribed yet: ${missing.join(', ')})`);

    // Frame the stack on the always-present parts (shoes + bodies) in their posed (animated, skinned) state.
    mixers.forEach((m) => m.update(0)); frog.updateMatrixWorld(true);
    const box = new THREE.Box3();
    const core = frog.children.filter((c) => c.userData.bfCore);
    (core.length ? core : frog.children).forEach((c) => {
      c.traverse((o) => { if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); o.computeBoundingSphere(); } });
      box.expandByObject(c, true);
    });
    const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, radius / 100, radius * 100);
    // Minimal orbit (drag = rotate, wheel/pinch = zoom, idle = slow auto-rotate). No OrbitControls inscription needed.
    let theta = 0.6, phi = 1.2, dist = radius * 5.2, drag = null, idle = 0;
    const place = () => { camera.position.set(center.x + dist * Math.sin(phi) * Math.sin(theta), center.y + dist * Math.cos(phi), center.z + dist * Math.sin(phi) * Math.cos(theta)); camera.lookAt(center); };
    const cv = renderer.domElement;
    cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', (e) => { if (!drag) return; theta -= (e.clientX - drag.x) * 0.008; phi = Math.min(2.9, Math.max(0.2, phi - (e.clientY - drag.y) * 0.008)); drag = { x: e.clientX, y: e.clientY }; idle = 0; });
    cv.addEventListener('pointerup', () => { drag = null; });
    cv.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.min(radius * 12, Math.max(radius * 1.2, dist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: false });
    window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta(); idle += dt;
      if (!drag && idle > 2 && __bfPreview.spin()) theta += dt * 0.35; /*PREVIEW HOOK*/
      mixers.forEach((m) => m.update(__bfPreview.dt(dt))); /*PREVIEW HOOK*/ place(); renderer.render(scene, camera);
    });
    if (overlay) overlay.style.display = 'none';
    const badge = document.createElement('div'); badge.id = 'bf-b';
    badge.textContent = `${blockHeight}.BITMAP · ${VALIDITY.state.toUpperCase()}${VALIDITY.note ? ' · ' + VALIDITY.note : ''}`
      + (missing.length ? ` · ${missing.length} PART(S) NOT INSCRIBED` : '') + (failed ? ` · ${failed} FAILED` : '');
    if (VALIDITY.state === 'duplicate' || VALIDITY.state === 'invalid') badge.style.color = '#ff8a7a';
    document.body.appendChild(badge);
    document.title = `BlockFrogs · ${blockHeight}.bitmap`;
    window.__bf = { blockHeight, traits: traits.map((t) => t.part + (t.color ? `_${t.color}` : '')), loaded: frog.children.length, missing, failed, validity: VALIDITY };
  };

  /* ======================= BOOT ======================= */
  (async () => {
    const mml = isMMLHost();
    if (!mml) say('LOADING FROG', 'reading the chain…');
    const watchdog = mml ? 0 : setTimeout(() => { if (!window.__bf) say('STILL LOADING…', 'the chain is slow or a recursive endpoint is unavailable', true); }, 20000);
    try {
      const netName = await detectNetwork();
      const net = NETWORKS[netName];
      const ownId = getOwnId();
      const blockHeight = await getBlockHeight(ownId, net);
      const confHash = await getConfirmationHash(ownId);
      const traits = __bfPreview.traits(deriveTraits(blockHeight, confHash), blockHeight, confHash); /*PREVIEW HOOK*/
      applyMML(net, blockHeight, traits); __bfPreview.applied(blockHeight, traits); /*PREVIEW HOOK*/
      if (!mml) await renderThree(net, blockHeight, traits);
    } catch (e) {
      if (mml) console.error(e); else fail(e);
    } finally { if (watchdog) clearTimeout(watchdog); }
  })();
  window.addEventListener('error', (e) => { if (!isMMLHost() && !window.__bf) fail(e.error || e.message); });
</script>
